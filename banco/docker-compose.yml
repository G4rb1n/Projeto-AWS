services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: always
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootlocal}
      MYSQL_DATABASE: ${DB_NAME:-zadinventory}
      MYSQL_USER: ${DB_USER:-banco}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    volumes:
      - mariadb_data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    restart: always
    network_mode: host
    environment:
      KC_DB: mariadb
      KC_DB_URL_HOST: 192.168.1.15
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - mariadb

volumes:
  mariadb_data: