# Uso exclusivo para teste local (subir MySQL + backend na mesma rede).
# Em producao (Elastic Beanstalk + RDS) as variaveis abaixo sao definidas
# na configuracao do ambiente, nunca neste arquivo.
services:
  mysql:
    image: mysql:8.0
    container_name: zadinventory-mysql
    restart: unless-stopped
    # O plugin padrao (caching_sha2_password) exige TLS ou allowPublicKeyRetrieval;
    # como a URL local usa useSSL=false, mantemos o plugin nativo no teste local.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootlocal}
      MYSQL_DATABASE: ${DB_NAME:-zadinventory}
      MYSQL_USER: ${DB_USER:-zad}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zadlocal}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: zadinventory-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zadinventory}
      DB_USER: ${DB_USER:-zad}
      DB_PASSWORD: ${DB_PASSWORD:-zadlocal}
      JWT_SECRET: ${JWT_SECRET:-bG9jYWwtZGV2LW9ubHktbm90LWEtcmVhbC1zZWNyZXQh}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
