# Configura��es do H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=false

# Configura��es gerais
spring.main.allow-bean-definition-overriding=true
spring.jpa.defer-datasource-initialization=false

# Configura��es para resolver problemas de serializa��o (iguais ao production)
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Otimiza��es de desempenho para carregamento de relacionamentos
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Configura��o avan�ada de serializa��o
spring.jackson.serialization.write-single-elem-arrays-unwrapped=false
spring.jackson.deserialization.READ_UNKNOWN_ENUM_VALUES_USING_DEFAULT_VALUE=true

# Valores dummy apenas para os testes (em runtime vem de JWT_SECRET / CORS_ORIGINS)
jwt.secret=emFkaW52ZW50b3J5LXRlc3Qtc2VjcmV0LWtleS0wMTIz
jwt.expiration=86400000
cors.allowed-origins=http://localhost:4200

# Logging reduzido para testes
logging.level.org.springframework=WARN
logging.level.app.zad.zadinventory=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF