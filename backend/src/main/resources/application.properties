spring.application.name=zadinventory
# Configuracao do MySQL 8.0 - todos os valores vem de variaveis de ambiente
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracoes para resolver problemas de serializacao
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Otimizacoes de desempenho para carregamento de relacionamentos
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Configuracao avancada de serializacao
spring.jackson.serialization.write-single-elem-arrays-unwrapped=false
spring.jackson.deserialization.READ_UNKNOWN_ENUM_VALUES_USING_DEFAULT_VALUE=true

# Configuracoes do JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS - origens liberadas, separadas por virgula
cors.allowed-origins=${CORS_ORIGINS}

#  Configuracao Hikari
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
